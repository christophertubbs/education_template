{% extends "education_runtime/base.html" %}
{% block title %}Curricula{% endblock %}
{% block content %}
<h1>Curricula</h1>
{% for item in curricula %}
  <article><h2><a href="{% url 'education_runtime:curriculum-detail' item.identifier %}">{{ item.title }}</a></h2><p>{{ item.description }}</p></article>
{% empty %}<p>No Curriculum Products are installed.</p>{% endfor %}
{% endblock %}
