{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Education Runtime{% endblock %}</title>
  <link rel="icon" href="{% static 'education_runtime/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'education_runtime/runtime.css' %}">
  {% block head %}{% endblock %}
</head>
<body data-curriculum-id="{{ curriculum.identifier|default:'' }}" data-curriculum-version="{{ curriculum.version|default:'' }}" data-pop-url="{% if curriculum %}{{ curriculum.get_pop_assessment_url }}{% endif %}" data-pop-probability="{{ curriculum.pop_quiz_probability|default:0 }}" data-pop-cooldown="{{ curriculum.pop_quiz_cooldown|default:3 }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a href="{% url 'education_runtime:curriculum-list' %}">Curricula</a>
    {% if curriculum %}
      <nav aria-label="Curriculum">
        <a href="{% url 'education_runtime:curriculum-detail' curriculum.identifier %}">Contents</a>
        <a href="{% url 'education_runtime:glossary' curriculum.identifier %}">Glossary</a>
        <a href="{% url 'education_runtime:sources' curriculum.identifier %}">Sources</a>
        <a href="{% url 'education_runtime:progress' curriculum.identifier %}">Progress</a>
      </nav>
    {% endif %}
  </header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  <script src="{% static 'education_runtime/progress.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
