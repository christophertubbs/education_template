{% extends "base.html" %}
{% block title %}Glossary{% endblock %}
{% block content %}
<section>
    <h1>Glossary</h1>
    <dl class="glossary-list">
        {% for entry in entries %}
            <dt id="{{ entry.identifier }}">{{ entry.term }}</dt>
            <dd>{{ entry.definition }}</dd>
        {% endfor %}
    </dl>
</section>
{% endblock %}
