[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "__APP_NAME__"
version = "1.0.0"
description = "Curriculum Product for __DISPLAY_NAME__."
requires-python = ">=3.11"
dependencies = ["education-curriculum-system__RUNTIME_COMPATIBILITY__"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
__APP_NAME__ = ["data/*.json"]

