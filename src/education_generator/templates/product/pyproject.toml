[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "__APP_NAME__"
version = "__PRODUCT_VERSION__"
description = "Curriculum Product for __DISPLAY_NAME__."
requires-python = ">=3.11"
dependencies = ["education-curriculum-system__RUNTIME_COMPATIBILITY__"]

[project.entry-points."education_curriculum.products"]
__APP_NAME__ = "__APP_NAME__.apps:__APP_CONFIG_CLASS__"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
__APP_NAME__ = ["data/*.json"]
