{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Education{% endblock %}</title>
    <link rel="stylesheet" href="{% static '__APP_NAME__/css/curriculum.css' %}">
    <script defer src="{% static '__APP_NAME__/js/progress.js' %}"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url '__APP_NAME__:index' %}">__DISPLAY_NAME__ Curriculum</a>
        <nav aria-label="Primary">
            <a href="{% url '__APP_NAME__:index' %}">Lessons</a>
            <a href="{% url '__APP_NAME__:glossary' %}">Glossary</a>
            <a href="{% url '__APP_NAME__:progress' %}">Progress</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
