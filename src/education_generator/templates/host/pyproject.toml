[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "education-host"
version = "0.1.0"
description = "Standalone Django host for generated curriculum apps"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["standalone*"]
